name: Deploy Assets to WordPress.org Repository

on:
  push:
    branches:
      - main

jobs:
  deploy_to_wp_repository:
    name: Deploy assets to WP.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No composer install here: the asset action only syncs readme.txt and
      # .wordpress-org/ to SVN, and it refuses to deploy when anything else in
      # the working copy is modified. Installing dependencies builds a vendor/
      # tree that differs from what is committed to SVN trunk, which tripped
      # that guard on every run ("Other files have been modified").
      - name: WordPress Plugin Assets Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
