name: Deploy Assets to WordPress.org Repository

on:
  push:
    branches:
      - main

jobs:
  deploy_to_wp_repository:
    name: Deploy assets to WP.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The composer step looks removable but is not: the asset action's
      # "revert changes in vendor/composer" step fails when trunk/vendor is
      # absent, and it refuses to deploy when the installed vendor differs
      # from what the last release committed to SVN. Consequence: this job can
      # fail on pushes that land after a dependency merge but before the next
      # release deploys matching vendor to SVN; it self-heals on the first run
      # after that release. Re-run a failed job rather than removing this step.
      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          php_version: 8.3.6
          php_extensions: bcmath

      - name: WordPress Plugin Assets Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
