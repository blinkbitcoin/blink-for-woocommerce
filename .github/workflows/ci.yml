name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WP_VERSION_DEFAULT: '6.6'
  WC_VERSION_DEFAULT: '9.3.2'

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint:phpcs
      - run: composer lint:phpstan
      - run: composer lint:ignores

  lint-format:
    name: Lint formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run lint:js

  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every source file
        run: find src blink-for-woocommerce.php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  unit:
    name: Unit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test:unit

  integration:
    name: Integration PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / WC ${{ matrix.wc }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimums the plugin actually claims to support.
          - { php: '8.1', wp: '6.6', wc: '9.3.2' }
          - { php: '8.2', wp: '6.6', wc: 'latest' }
          - { php: '8.3', wp: 'latest', wc: 'latest' }
          # Advisory: catches core changes before they ship.
          - { php: '8.3', wp: 'trunk', wc: 'latest', experimental: true }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Cache WordPress test library
        uses: actions/cache@v4
        with:
          path: |
            /tmp/wordpress
            /tmp/wordpress-tests-lib
          key: wp-${{ matrix.wp }}-${{ hashFiles('bin/install-wp-tests.sh') }}
      - name: Install WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root '127.0.0.1:3306' ${{ matrix.wp }} true
      - name: Install WooCommerce
        run: bash bin/install-woocommerce.sh ${{ matrix.wc }}
      - name: Run the integration suite
        env:
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
          WC_PLUGIN_DIR: /tmp/wordpress/wp-content/plugins/woocommerce
        run: composer test:integration

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch to compare against.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Xdebug, not pcov: pcov is a line-hit sampler and cannot produce
          # branch coverage at all, which is what this gate is for.
          coverage: xdebug
          extensions: mysqli
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Cache WordPress test library
        uses: actions/cache@v4
        with:
          path: |
            /tmp/wordpress
            /tmp/wordpress-tests-lib
          key: wp-${{ env.WP_VERSION_DEFAULT }}-${{ hashFiles('bin/install-wp-tests.sh') }}
      - name: Install WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root '127.0.0.1:3306' ${{ env.WP_VERSION_DEFAULT }} true
      - name: Install WooCommerce
        run: bash bin/install-woocommerce.sh ${{ env.WC_VERSION_DEFAULT }}
      - name: Run both suites with branch coverage
        env:
          XDEBUG_MODE: coverage
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
          WC_PLUGIN_DIR: /tmp/wordpress/wp-content/plugins/woocommerce
        run: bin/run-coverage.sh
      - name: Require 100% line and branch coverage on gated files
        env:
          XDEBUG_MODE: coverage
        run: composer coverage:gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require 100% line coverage of the diff
        if: github.event_name == 'pull_request'
        run: |
          pip install "diff-cover>=9"
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover build/coverage/cobertura.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=100 \
            --markdown-report build/coverage/diff-coverage.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: build/coverage
          retention-days: 14

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run the JS suite with a 100% threshold
        run: npm run test:js:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: build/coverage-js
          retention-days: 14

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start the test site
        run: npx wp-env start --update
      - run: npm run test:e2e
      - name: Collect environment logs
        if: failure()
        run: npx wp-env logs all > build/wp-env.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            build/playwright-report
            build/test-results
            build/wp-env.log
          retention-days: 7

  # The single required check. Marking each matrix leg required would mean
  # editing branch protection every time the matrix changes, and a renamed leg
  # would silently stop being required.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint-php, lint-format, php-syntax, unit, integration, coverage, javascript, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"'; then
            echo "At least one required job failed."
            exit 1
          fi
          echo "All required jobs succeeded."
